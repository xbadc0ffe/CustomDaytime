"minecraft:overworld" {
    # Length of the daytime cycle in minutes
    # Default: 10.0
    dayLength=10.0

    # Length of the nighttime cycle in minutes
    # Default: 10.0
    nightLength=10.0

    # Enable or disable night acceleration when enough players sleep
    # False: use vanilla sleep-to-skip-night mechanic
    # Default: true
    accelerationEnabled=true

    # Multiplier for night acceleration during sleep
    # Example: nightLength=10.0 (= 600 seconds) and AccelerationMultiplier=100.0 -> Acceleration lasts 6 seconds
    # Default: 100.0
    AccelerationMultiplier=100.0

    # Fixes for vanilla mechanics that break when the day/night cycle is stretched.
    # Each toggle is per-world.
    corrections {
        # Keep villagers eligible to spawn iron golems on long days.
        # Minecraft only treats a villager as "recently slept" for 24000 ticks (one vanilla
        # day). On a stretched day the night alone outlasts that window, so villagers wake
        # already past it and natural iron golems stop spawning. This keeps that timer scaled
        # to your day length.
        # Effect when true: iron golems spawn from villagers as they do in vanilla.
        # Default: true
        villagerSleep=true

        # Keep working villagers' trades restocking through a long day.
        # Vanilla lets a villager restock only twice per day and resets that cap on the
        # day boundary, so on a stretched day trades sit depleted for a long time. This
        # restocks a villager at vanilla's real-time rate (about once per 10 real minutes)
        # as long as it is employed and actually reaching its workstation. Villagers with
        # no workstation contact are never restocked.
        # Effect when true: trades keep replenishing on long days instead of running dry.
        # Default: true
        villagerStock=true

        # Keep phantom "insomnia" tied to nights survived, not real time, on long days.
        # Phantoms begin once a player's time-since-rest passes 72000 ticks (3 vanilla
        # days). That counter runs on real game ticks, so on a stretched day it crosses
        # the threshold after far fewer nights than intended. This slows the counter to
        # match your day length.
        # NOTE: this rewrites the player's TIME_SINCE_REST statistic, so the value shown
        # on the in-game statistics screen will be inaccurate (lower than the real count).
        # Effect when true: phantoms appear after ~3 stretched nights without sleep.
        # Default: true
        phantomSpawn=true
    }
}